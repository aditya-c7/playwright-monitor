name: Daily Accessibility & Performance Monitor

# ------------------------------------------------------------------
# Runs every day at 9:00 AM IST (03:30 UTC, since IST = UTC+5:30)
# and can also be triggered manually from the GitHub "Actions" tab.
# ------------------------------------------------------------------
on:
  schedule:
    - cron: '30 3 * * *' # 09:00 IST daily
  workflow_dispatch: # Allow manual "Run workflow" button

# Grant the workflow permission to push results back to the repo
permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Set this repo variable to "true" to fail the workflow when
      # critical/serious a11y violations are found (optional strict mode).
      STRICT: ${{ vars.STRICT || 'false' }}

    steps:
      # 1. Check out the repository (full history so we can push back)
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Cache & install the Chromium browser binary
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install system dependencies for Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install-deps chromium

      # 5. Run the monitor (audit + screenshots + JSON data)
      - name: Run monitor
        run: node src/monitor.js

      # 6. Generate the HTML report
      - name: Generate HTML report
        run: node src/report-generator.js

      # 7. Commit & push fresh results back to the repo
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No changes to results — skipping commit."
          else
            git commit -m "chore: update monitor results [skip ci] ($(date -u +%Y-%m-%d))"
            git push
          fi

      # 8. Upload artifacts so results are downloadable from the run page too
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: |
            results/reports/
            results/screenshots/
            results/results.json
          retention-days: 30
